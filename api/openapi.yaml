openapi: 3.1.0
info:
  title: Museek API
  version: 1.0.0
  description: Private collection browsing and authorized MP3 playback.
servers:
  - url: https://music.example.com
paths:
  /v1/collections/{id}/share:
    post:
      operationId: sharePlaylist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      description: Creates a 24-hour link granting only a playlist the authenticated listener can access. The secret is in the URL fragment.
      responses:
        "201":
          description: A shareable HTTPS browser bridge to museek://playlist.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { description: Device session required. }
        "404": { description: Playlist unavailable to this listener. }
  /v1/playlist-links/redeem:
    post:
      operationId: redeemPlaylistLink
      security: [{ bearerAuth: [] }, {}]
      description: >-
        Adds the playlist grant to the authenticated recipient without replacing
        their session or existing grants. Without a bearer, creates a new listener
        and device session with only this playlist. A supplied invalid bearer
        fails instead of pairing anonymously. The issuer device and its playlist
        grant must still be active. Repeated authenticated redemptions are idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                deviceName: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Playlist added; session is present only for a new listener.
          content:
            application/json:
              schema:
                type: object
                required: [collectionId]
                properties:
                  collectionId: { type: string }
                  session: { $ref: "#/components/schemas/PairResult" }
        "400": { description: Invalid request. }
        "401": { description: Supplied device session is invalid or revoked. }
        "404": { description: Invitation expired or unavailable. }
        "429": { description: More than five redemptions per client IP in five minutes. }
  /v1/server:
    servers:
      - url: https://elitedesk-1.tail6900fe.ts.net:10002
    x-private-listener-only: true
    get:
      operationId: discoverTailnetServer
      description: >-
        Available only on the opt-in private listener behind trusted local Tailscale
        Serve. Requires the proxy-injected exact allowlisted Tailscale identity;
        rejects Funnel ingress. Never available on the public listener. Clients
        must not supply identity headers. Does not create sessions or grants.
      responses:
        "200":
          description: Authorized Museek server detected; explicit Join tap still required.
          content:
            application/json:
              schema:
                type: object
                required: [name, tailnetJoin, version]
                properties:
                  name: { const: Museek }
                  tailnetJoin: { const: true }
                  version: { const: 1 }
        "403": { description: "Missing, ambiguous, unauthorized identity or Funnel ingress." }
        "404": { description: This endpoint is not mounted on the public listener. }
  /v1/tailnet/join:
    servers:
      - url: https://elitedesk-1.tail6900fe.ts.net:10002
    x-private-listener-only: true
    post:
      operationId: joinTailnetServer
      description: >-
        Private trusted local Tailscale Serve ingress only, with the same identity
        checks as discovery. Call only on explicit user action. Creates an ordinary
        revocable device session for the preconfigured existing recipient; creates
        no recipients or collection grants. Identity is never accepted from the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deviceName: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Device session created using existing recipient grants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "400": { description: "Invalid JSON, unknown fields or device name longer than 200 UTF-8 bytes." }
        "403": { description: "Missing, ambiguous, unauthorized identity or Funnel ingress." }
        "404": { description: This endpoint is not mounted on the public listener. }
        "429": { description: More than five join attempts per identity in five minutes. }
  /invite:
    get:
      operationId: openInvitation
      responses:
        "200":
          description: Minimal browser bridge that opens a Museek pairing deep link from the URL fragment.
          content:
            text/html: {}
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Server and database are available.
  /v1/pair:
    post:
      operationId: pairDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string, example: ABCD-2345 }
                deviceName: { type: string, example: iPhone }
      responses:
        "201":
          description: Device session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many pairing attempts.
  /v1/collections:
    get:
      operationId: listCollections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Collections granted to this recipient.
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/collections/{id}:
    get:
      operationId: getCollection
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Collection and ordered tracks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Collection"
                  - type: object
                    required: [tracks]
                    properties:
                      tracks:
                        type: array
                        items: { $ref: "#/components/schemas/Track" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/collections/{id}/listens:
    post:
      operationId: recordPlaylistListen
      description: >-
        Records one iPhone playback after more than 30000 milliseconds of actual
        listening in this playlist. Requires a current session, playlist grant,
        and track membership. The UUID is persisted by the client and reused on
        retries, including offline sync. Repeating the same event is idempotent;
        reusing its ID for another playlist, track, or recipient is rejected.
        Source and elapsed playback are client-reported, not device attestation.
        Stream fetches and downloads do not record plays.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, trackId, client, listenedMs]
              properties:
                id: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
                trackId: { type: string, minLength: 1 }
                client: { const: iphone }
                listenedMs: { type: integer, minimum: 30001 }
      responses:
        "200":
          description: Listen recorded, or the same listen was already recorded.
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: { const: true }
        "400": { description: Invalid listen, client, duration, or reused event ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tracks/{id}/play-url:
    post:
      operationId: createPlayUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Short-lived URL authorized for one track.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/streams/{id}:
    get:
      operationId: streamTrack
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full MP3 response.
          content:
            audio/mpeg: {}
        "206":
          description: Byte range of the MP3.
          content:
            audio/mpeg: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/artwork/{id}:
    get:
      operationId: getArtwork
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Authorized artwork bytes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked authorization.
    NotFound:
      description: The resource is absent or not granted to this recipient.
  schemas:
    PairResult:
      type: object
      required: [token, recipient]
      properties:
        token: { type: string }
        recipient:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
    Collection:
      type: object
      required: [id, name, trackCount, lastScanned]
      properties:
        id: { type: string }
        name: { type: string }
        artworkId: { type: string }
        trackCount: { type: integer, minimum: 0 }
        lastScanned: { type: string, format: date-time }
    Track:
      type: object
      required: [id, collectionId, title]
      properties:
        id: { type: string }
        collectionId: { type: string }
        playCount:
          type: integer
          minimum: 0
          description: >-
            Total qualifying iPhone listens for this track in this playlist,
            across listeners and devices. Includes synced offline listens.
            Starts at zero; no historical listens are inferred. Removed with the
            playlist entry. Older servers may omit this field; clients use zero.
        note:
          type: string
          maxLength: 10000
          description: Optional plain-text note scoped to this collection entry. Omitted when absent; removed with the entry. Managed in the separate owner browser interface. A library song can belong to several collections with independent notes and ordering.
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        discNumber: { type: integer, minimum: 0 }
        trackNumber: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
        artworkId: { type: string }
