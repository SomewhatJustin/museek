name: Museek
options:
  bundleIdPrefix: app.museek
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: JSKJUMBXQ3
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Museek:
    type: application
    platform: iOS
    sources:
      - path: Museek
      - path: ios/Runner/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.museek.museekApp
        PRODUCT_NAME: Museek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Museek/Info.plist
    scheme:
      testTargets:
        - MuseekTests
  MuseekTests:
    type: bundle.unit-test
    platform: iOS
    sources: MuseekTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Museek
