name: museek

services:
  museek:
    build:
      context: ../server
    image: museek:local
    environment:
      MUSEEK_MUSIC_DIR: /music
      MUSEEK_DATA_DIR: /data
      MUSEEK_LISTEN: :8080
      MUSEEK_PUBLIC_URL: https://${MUSEEK_DOMAIN}
    volumes:
      - ${MUSEEK_MUSIC_PATH:-./music}:/music:ro
      - museek-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    environment:
      MUSEEK_DOMAIN: ${MUSEEK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - museek
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  museek-data:
  caddy-data:
  caddy-config:

