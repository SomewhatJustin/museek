name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (false = unsigned simulator build only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: museek-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'SomewhatJustin/museek'
    runs-on: [self-hosted, macOS, ARM64, museek]
    environment: testflight
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.2.0.app/Contents/Developer
      APPLE_TEAM_ID: JSKJUMBXQ3 # Justin Fowler's personal team
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Homebrew PATH and check tools
        run: |
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo '/opt/homebrew/sbin' >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          xcodebuild -version
          xcodegen --version
      - name: Verify unsigned simulator build (no runtime required)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        run: bash scripts/verify_ios.sh
      - name: Unlock runner signing keychain
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          signing_keychain="$HOME/Library/Keychains/museek-ci.keychain-db"
          security unlock-keychain -p "$(cat "$HOME/.config/museek-ci/keychain-password")" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
      - name: Test, archive and upload
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash scripts/ci_testflight.sh
      - name: Always remove temporary API key material
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/museek-asc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          security lock-keychain "$HOME/Library/Keychains/museek-ci.keychain-db"
